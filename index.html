<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>화면 속 작은 전시장</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
<main class="poster" aria-label="화면 속 작은 전시장 — 카드에 마우스를 올리면 관람객이 나타납니다">
  <img class="background" src="./background.png" alt="대각선 전시 타이포그래피가 놓인 밝은 전시장 바닥" draggable="false">
  <div class="card card-a" tabindex="0" role="button" aria-label="전시 카드 A 일시 정지" aria-pressed="false">
    <img class="card-image" src="./A_card.png" alt="전시 포스터 A" draggable="false">
    <img class="people people-first" src="./people-1.png" alt="" aria-hidden="true" draggable="false">
    <img class="people people-second" src="./people-4.png" alt="" aria-hidden="true" draggable="false">
  </div>
  <div class="card card-b" tabindex="0" role="button" aria-label="전시 카드 B 일시 정지" aria-pressed="false">
    <img class="card-image" src="./B_card.png" alt="전시 포스터 B" draggable="false">
    <img class="people people-first" src="./people-2.png" alt="" aria-hidden="true" draggable="false">
    <img class="people people-second" src="./people-3.png" alt="" aria-hidden="true" draggable="false">
  </div>
  <div class="card card-c" tabindex="0" role="button" aria-label="전시 카드 C 일시 정지" aria-pressed="false">
    <img class="card-image" src="./C_card.png" alt="전시 포스터 C" draggable="false">
    <img class="people people-first" src="./people-1.png" alt="" aria-hidden="true" draggable="false">
    <img class="people people-second" src="./people-4.png" alt="" aria-hidden="true" draggable="false">
  </div>
</main>
</body>
</html>
